# MkDocs Material configuration for the published site.
#
# The `nav` key is deliberately absent. `scripts/build_manifest.py` stages the
# markdown tree into `site-build/`, generates the navigation from the parsed
# paper list, appends it to a copy of this file as `mkdocs.generated.yml`, and
# the site is built from that. Editing `nav` here would be overwritten, so edit
# write_mkdocs() in the generator instead.
#
# Everything else in this file is hand-maintained. Build with:
#   python3 scripts/build_manifest.py && mkdocs build -f mkdocs.generated.yml

site_name: Foundational GenAI Papers, Summarized
site_description: >-
  Plain-language summaries of the papers that built modern generative AI -
  Transformers to diffusion, RLHF to reasoning models. Free, no signup.
site_author: Patrick Wiloak
site_url: https://patrickwiloak.github.io/genai-research-papers-summarized/

repo_url: https://github.com/PatrickWiloak/genai-research-papers-summarized
repo_name: genai-research-papers-summarized
edit_uri: edit/main/

copyright: >-
  Built by <a href="https://patrickwiloak.com">Patrick Wiloak</a> at
  <a href="https://noblerworks.com/">Nobler Works</a>. Practice what you read at
  <a href="https://gitgood.dev">gitGood.dev</a>. Summaries CC BY 4.0.

# Generated by scripts/build_manifest.py. Never edit site-build/ by hand.
docs_dir: site-build
site_dir: site
use_directory_urls: true

theme:
  name: material
  language: en
  icon:
    repo: fontawesome/brands/github
    # Material's stock mark is a book, which says "documentation" and nothing
    # about this site. An atom reads as research and stays legible as a
    # silhouette at 24px.
    logo: material/atom-variant
  features:
    # No navigation.tabs. With tabs the left sidebar shows only the active tab's
    # subtree, so Home renders an almost empty column while a paper renders a
    # deep one - the sidebar changes shape depending on where you are. Without
    # tabs it is the same tree everywhere, with the current branch expanded.
    - navigation.sections
    - navigation.top
    - navigation.footer
    - navigation.tracking
    # One sidebar, always on the left: the page's table of contents folds into
    # the navigation instead of claiming a second column on the right. Paper
    # summaries have deep heading trees and benefit from the extra width.
    - toc.integrate
    - toc.follow
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.action.edit
    - content.tooltips
  palette:
    # Near-black plus one amber accent. `custom` opts out of Material's built-in
    # colour palettes entirely; the actual values live in
    # .github/site/extra.css under the scheme selectors.
    # All three entries need it - the first is what renders before the palette
    # JS runs, so omitting it there shows Material's default indigo.
    - media: "(prefers-color-scheme)"
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-auto
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to system preference
  # Shared with the sibling zero-to-hero site. Both families are served by
  # Google Fonts, which is where Material loads webfonts from.
  font:
    text: Geist
    code: Geist Mono

plugins:
  - search:
      separator: '[\s\-_,:!=\[\]()"`/]+|\.(?!\d)|&[lg]t;|(?!\b)(?=[A-Z][a-z])'
  - minify:
      minify_html: true
      minify_js: true
      minify_css: true
      htmlmin_opts:
        remove_comments: true
      cache_safe: true

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
      permalink_title: Anchor link to this section
      toc_depth: 3
      # Match GitHub's heading-slug algorithm exactly. The summaries' anchor
      # links were written against GitHub's rendering, where "Results & Impact"
      # becomes "#results--impact" and a leading emoji leaves a leading hyphen.
      # Python-Markdown's default slugifier collapses both, which would break
      # those links on the site only.
      slugify: !!python/object/apply:pymdownx.slugs.slugify {kwds: {case: lower}}
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  # No `linenums` / `line_spans` / `anchor_linenums`: no summary uses line
  # numbering or highlighting, and the per-line <span> markup they emit inflates
  # the built site substantially across the collection's code blocks.
  - pymdownx.highlight:
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.saneheaders
  - pymdownx.smartsymbols
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true

# Link integrity is already enforced against the source tree by
# scripts/check_links.py. These settings catch what only appears once the tree
# is rendered: links to files outside the site, and anchors that do not exist on
# the target page. The Pages workflow builds with --strict, so these become
# errors in CI.
validation:
  omitted_files: info
  not_found: warn
  absolute_links: warn
  unrecognized_links: warn
  anchors: warn

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/PatrickWiloak/genai-research-papers-summarized
      name: This repository on GitHub
    - icon: fontawesome/solid/graduation-cap
      link: https://gitgood.dev
      name: gitGood.dev - practice and certification prep
    - icon: fontawesome/solid/globe
      link: https://noblerworks.com/
      name: Nobler Works
    - icon: fontawesome/brands/youtube
      link: https://youtube.com/@patrickwiloak
      name: Patrick Wiloak on YouTube
    - icon: fontawesome/brands/linkedin
      link: https://www.linkedin.com/in/patricklukewilson/
      name: Patrick Wiloak on LinkedIn

extra_css:
  - assets/site/extra.css
